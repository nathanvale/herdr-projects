name: Private custom-domain proof
on:
  push:
    branches: [feat/private-custom-domain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: TLS and WebSocket admission
        run: bun test service/private-domain.test.ts
      - name: Owner-refusal sensitivity, then restore
        shell: bash
        run: |
          cp service/auth.ts /tmp/private-domain-auth-original.ts
          trap 'cp /tmp/private-domain-auth-original.ts service/auth.ts' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('service/auth.ts')
          s = p.read_text()
          guard = 'if (privatePeer.login !== g.owner)'
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, 'if (false)'))
          PY
          set +e
          bun test service/private-domain.test.ts -t 'another identity cannot reach the handler' > /tmp/private-domain-negative.log 2>&1
          status=$?
          set -e
          cat /tmp/private-domain-negative.log
          test "$status" -ne 0
          grep -E '^[[:space:]]*1 fail$' /tmp/private-domain-negative.log
          cp /tmp/private-domain-auth-original.ts service/auth.ts
          bun test service/private-domain.test.ts
