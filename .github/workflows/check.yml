name: FORG-2 bounded evidence
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@localhost
jobs:
  controls:
    name: controls batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The definition checkout is the protected authoring owner (manifest '.').
      # Each tested candidate is a separate standalone clone under RUNNER_TEMP.
      - run: python3 .github/forg2-proof/run-batch.py '${{ matrix.batch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forg2-controls-${{ matrix.batch }}
          path: ${{ runner.temp }}/forg2-controls-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 14
