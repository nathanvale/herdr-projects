# Shepherdr 3.0's check on GitHub's runners, on every pull request to main, foundry-base or an integration branch
# (integrate/...) and every push to main (a merge). A task waits for its pull request's run before it merges. A branch
# with no pull request can still be checked by hand: gh workflow run check.yml --ref <branch>.
# candidate-readiness skips pull requests into an integration branch: it fails there by design, and a failing check
# would hold every such pull request. It runs everywhere else, and by hand.
#
# One lean job (GitHub bills by the minute): the shared lib copies, every mod's JavaScript parsed, the TypeScript
# helpers built, the service and web app typechecked, tested and built, the Python compiled, the repo's own rules (test_repo), the installer against throwaway roots
# (test_install: install, again, update, clash, adopt, uninstall, dry run), herdr-task's commands and a report-only Fallow
# maintainability report (docs/fallow.md).
# herdr-app check needs Herdr's window runtime, which a runner doesn't have: mods are checked on a person's machine.
name: Check

on:
  # no paths-ignore here: a docs-only pull request must report a check too, or it could never merge
  pull_request:
    branches: [main, foundry-base, 'integrate/**']
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: shared lib copies match lib/
        run: python3 bin/sync-shared --check
      - name: fixed-input source foundation and pending fork obligations
        run: python3 bin/check-migration
      - name: JavaScript parses
        run: |
          fail=0
          for f in $(find mods lib core -name '*.js' 2>/dev/null); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }
          done
          exit $fail
      - name: TypeScript helpers build
        run: |
          for f in $(find mods -name '*.ts'); do
            bun build --no-bundle --target bun "$f" > /dev/null || exit 1
          done
      - name: JSON parses
        run: for f in keys.json layouts/*.json lib/addons.json lib/features.json $(find mods -name '*.json'); do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: service, shared core and web app (types, tests, build)
        run: |
          bun install --frozen-lockfile
          bun web/build-plugins.ts   # web/generated/ (not in git): the plugin list the app imports
          bunx tsc --noEmit -p .
          bun test service core web
          bun run build
      - name: Fallow maintainability report (report-only)
        # docs/fallow.md. Needs the step above (node_modules, web/generated). Fallow exits 1 on findings: reported,
        # never enforced here. 2 or above is a broken config or tool, which fails the step.
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          bun install --cwd tools/fallow --frozen-lockfile
          fallow() {
            code=0; bun run --cwd tools/fallow "$@" || code=$?
            if [ "$code" -ge 2 ]; then echo "::error::Fallow could not run ($*): exit $code" >&2; exit "$code"; fi
          }
          fallow report --format github-summary --quiet >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = pull_request ]; then
            fallow audit --format github-summary --quiet >> "$GITHUB_STEP_SUMMARY"
            fallow audit --format github-annotations --quiet
          fi
      - name: shell scripts parse
        # each with the shell its first line names (bash scripts use bash-only syntax; sh is dash here)
        run: |
          for f in install.sh guard/herdr-app $(find mods -name '*.sh'); do
            case "$(head -1 "$f")" in *bash*) bash -n "$f" ;; *) sh -n "$f" ;; esac || { echo "::error file=$f::doesn't parse"; exit 1; }
          done
      - name: tests (repo rules, installer, herdr-task)
        run: python3 -m unittest discover -s test -v
      - name: installer into a brand-new throwaway home (dry run, install, doctor, uninstall)
        run: |
          root=$(mktemp -d)
          ./install.sh --root "$root" --dry-run --yes
          ./install.sh --root "$root" --yes
          python3 bin/shepherdr doctor --root "$root"
          python3 bin/shepherdr uninstall --root "$root"

  candidate-readiness:
    name: candidate-readiness
    if: github.event_name != 'pull_request' || !startsWith(github.base_ref, 'integrate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: required fork ports and qualification block deployment readiness
        run: python3 bin/check-migration --require-ready
