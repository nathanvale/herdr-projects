name: FORG-2 shared swipe diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@localhost
jobs:
  observe:
    name: unchanged seven-file workload (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - revision: base
            sha: 8237f81c7b61684d167784415d48b259850afced
          - revision: candidate
            sha: 16604cae5cf6a9eee43a7cca53901d59b285a2ec
    steps:
      - uses: actions/checkout@v4
        with:
          path: definition
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: candidate
      - run: bun x playwright-core install --only-shell chromium
        working-directory: candidate
      - run: python3 definition/.github/forg2-proof/ui-repro.py '${{ matrix.revision }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swipe-workload-${{ matrix.revision }}
          path: ${{ runner.temp }}/swipe-workload-${{ matrix.revision }}/
          if-no-files-found: error
          retention-days: 14
