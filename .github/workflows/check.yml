name: FORG-2 bounded evidence
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@localhost
jobs:
  controls:
    name: controls batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The definition checkout is the protected authoring owner (manifest '.').
      # Each tested candidate is a separate standalone clone under RUNNER_TEMP.
      - run: python3 .github/forg2-proof/run-batch.py '${{ matrix.batch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forg2-controls-${{ matrix.batch }}
          path: ${{ runner.temp }}/forg2-controls-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 14
  browser:
    name: unchanged swipe observation (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            sha: 8237f81c7b61684d167784415d48b259850afced
          - revision: candidate
            sha: fae5bc0a0047f383b162ccbf514f2d0a12b7c578
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x playwright-core install --only-shell chromium
      - name: Observe the unchanged test; a failure remains a failure
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/swipe-${{ matrix.revision }}"
          git rev-parse HEAD > "$RUNNER_TEMP/swipe-${{ matrix.revision }}/head.txt"
          set +e
          bun run test layout-sending -t 'a long reply folds to Show more' > "$RUNNER_TEMP/swipe-${{ matrix.revision }}/test.log" 2>&1
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/swipe-${{ matrix.revision }}/exit-code.txt"
          cat "$RUNNER_TEMP/swipe-${{ matrix.revision }}/test.log"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swipe-${{ matrix.revision }}
          path: ${{ runner.temp }}/swipe-${{ matrix.revision }}/
          if-no-files-found: error
          retention-days: 14
